<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="560" viewBox="0 0 1440 560" role="img" aria-labelledby="title desc">
  <title id="title">CapsLock Extended — one modifier, many Windows workflows</title>
  <desc id="desc">A dark keyboard-first composition showing CapsLock as a second control layer with shortcuts for navigation, clipboard, windows, and tabs.</desc>

  <rect width="1440" height="560" rx="34" fill="#121722"/>
  <rect x="32" y="32" width="1376" height="496" rx="28" fill="#182131" stroke="#34445F" stroke-width="2"/>

  <!-- Brand mark / modifier key -->
  <g transform="translate(74 84)">
    <rect x="0" y="0" width="360" height="360" rx="92" fill="#1A2230" stroke="#6B95D6" stroke-width="8"/>
    <path d="M278 116 C250 80 208 62 162 62 C86 62 36 120 36 180 C36 240 86 298 162 298 C208 298 250 280 278 244"
          fill="none" stroke="#DCE8FF" stroke-width="54" stroke-linecap="round"/>
    <path d="M248 146 H304 M248 214 H304" fill="none" stroke="#6B95D6" stroke-width="18" stroke-linecap="round"/>
    <circle cx="286" cy="76" r="11" fill="#C4A95E"/>
    <text x="180" y="344" text-anchor="middle" fill="#8EA6CA" font-family="Cascadia Code, Consolas, monospace" font-size="13" font-weight="700" letter-spacing="2">SECOND CONTROL LAYER</text>
  </g>

  <!-- Product statement -->
  <g transform="translate(486 78)">
    <text x="0" y="26" fill="#82A8E0" font-family="Cascadia Code, Consolas, monospace" font-size="15" font-weight="700" letter-spacing="3">AUTOHOTKEY V2 / WINDOWS</text>
    <text x="0" y="90" fill="#F0F4FF" font-family="Segoe UI, Arial, sans-serif" font-size="48" font-weight="650">CapsLock Extended</text>
    <text x="0" y="128" fill="#AEB9CF" font-family="Segoe UI, Arial, sans-serif" font-size="20">One modifier for keyboard-first desktop workflows.</text>

    <!-- Real shortcut proof -->
    <g transform="translate(0 176)">
      <rect x="0" y="0" width="208" height="92" rx="20" fill="#202A3B" stroke="#34445F"/>
      <text x="22" y="31" fill="#82A8E0" font-family="Cascadia Code, Consolas, monospace" font-size="13">CAPS + C</text>
      <text x="22" y="61" fill="#F0F4FF" font-family="Segoe UI, Arial, sans-serif" font-size="17">Copy as plain text</text>
      <text x="22" y="80" fill="#73829B" font-family="Cascadia Code, Consolas, monospace" font-size="11">clipboard pipeline</text>
    </g>

    <g transform="translate(226 176)">
      <rect x="0" y="0" width="208" height="92" rx="20" fill="#202A3B" stroke="#34445F"/>
      <text x="22" y="31" fill="#82A8E0" font-family="Cascadia Code, Consolas, monospace" font-size="13">CAPS + ← / →</text>
      <text x="22" y="61" fill="#F0F4FF" font-family="Segoe UI, Arial, sans-serif" font-size="17">Move by word</text>
      <text x="22" y="80" fill="#73829B" font-family="Cascadia Code, Consolas, monospace" font-size="11">text navigation</text>
    </g>

    <g transform="translate(0 284)">
      <rect x="0" y="0" width="208" height="92" rx="20" fill="#202A3B" stroke="#34445F"/>
      <text x="22" y="31" fill="#82A8E0" font-family="Cascadia Code, Consolas, monospace" font-size="13">CAPS + T</text>
      <text x="22" y="61" fill="#F0F4FF" font-family="Segoe UI, Arial, sans-serif" font-size="17">Toggle always-on-top</text>
      <text x="22" y="80" fill="#73829B" font-family="Cascadia Code, Consolas, monospace" font-size="11">window control</text>
    </g>

    <g transform="translate(226 284)">
      <rect x="0" y="0" width="208" height="92" rx="20" fill="#202A3B" stroke="#34445F"/>
      <text x="22" y="31" fill="#82A8E0" font-family="Cascadia Code, Consolas, monospace" font-size="13">CAPS + Q / E</text>
      <text x="22" y="61" fill="#F0F4FF" font-family="Segoe UI, Arial, sans-serif" font-size="17">Previous / next tab</text>
      <text x="22" y="80" fill="#73829B" font-family="Cascadia Code, Consolas, monospace" font-size="11">browser navigation</text>
    </g>

    <g transform="translate(0 418)">
      <rect x="0" y="0" width="434" height="44" rx="14" fill="#202A3B"/>
      <text x="20" y="28" fill="#71819B" font-family="Cascadia Code, Consolas, monospace" font-size="12">CAPSLOCK ×2</text>
      <text x="135" y="28" fill="#465873" font-family="Cascadia Code, Consolas, monospace" font-size="12">→</text>
      <text x="156" y="28" fill="#BFCADF" font-family="Segoe UI, Arial, sans-serif" font-size="13">native CapsLock remains available</text>
    </g>
  </g>

  <!-- Small modular cue -->
  <g transform="translate(1120 82)">
    <circle cx="0" cy="0" r="8" fill="#6B95D6"/>
    <circle cx="28" cy="0" r="6" fill="#82A8E0"/>
    <circle cx="52" cy="0" r="4" fill="#C4A95E"/>
  </g>
</svg>
