<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">CapsLock Extended application icon</title>
  <desc id="desc">A compact control key with a raised second plane, representing CapsLock Extended as a dedicated modifier layer for keyboard-first Windows workflows.</desc>

  <rect x="24" y="24" width="976" height="976" rx="224" fill="#121722"/>

  <!-- The rear plane is the extra command layer unlocked by holding CapsLock. -->
  <path d="M262 166 H762 C810 166 850 206 850 254 V338 H700 V278 H324 V338 H174 V254 C174 206 214 166 262 166 Z"
        fill="#202A3B" stroke="#4D6387" stroke-width="28" stroke-linejoin="round"/>

  <!-- Main keycap: the physical key is only the carrier for the modifier layer. -->
  <rect x="154" y="250" width="716" height="560" rx="142"
        fill="#1A2230" stroke="#6B95D6" stroke-width="30"/>

  <!-- C-shaped control mark: simple enough to survive 16–32 px rendering. -->
  <path d="M650 372 C608 318 540 286 463 286 C335 286 250 383 250 512 C250 641 335 738 463 738 C540 738 608 706 650 652"
        fill="none" stroke="#DCE8FF" stroke-width="92" stroke-linecap="round"/>

  <!-- Open side of the C becomes the active second-layer cue. -->
  <path d="M616 420 H748 M616 604 H748"
        fill="none" stroke="#6B95D6" stroke-width="30" stroke-linecap="round"/>

  <circle cx="786" cy="314" r="18" fill="#C4A95E"/>
</svg>
