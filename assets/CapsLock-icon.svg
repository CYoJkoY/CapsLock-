<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>CapsLock Extended application icon</title>
  <desc>A clean keyboard keycap with an upward modifier arrow, representing the CapsLock Extended productivity layer.</desc>

  <!-- Background -->
  <rect x="24" y="24" width="976" height="976" rx="224" fill="#14141D"/>

  <!-- Keycap body -->
  <path d="M184 268
           C184 222 222 184 268 184
           H756
           C802 184 840 222 840 268
           V704
           C840 750 802 788 756 788
           H268
           C222 788 184 750 184 704
           Z"
        fill="#232332"
        stroke="#3A3A52"
        stroke-width="24"/>

  <!-- Keycap face -->
  <rect x="232" y="232" width="560" height="488" rx="64"
        fill="#282838"
        stroke="#5B86C9"
        stroke-width="14"/>

  <!-- Modifier symbol -->
  <path d="M512 330
           L356 478
           H430
           V612
           H594
           V478
           H668
           Z"
        fill="#82A8E0"/>

  <!-- Keycap baseline -->
  <rect x="374" y="638" width="276" height="20" rx="10" fill="#5B86C9"/>

  <!-- Minimal status accent -->
  <circle cx="292" cy="138" r="14" fill="#6FA572"/>
  <circle cx="342" cy="138" r="10" fill="#C4A95E"/>
  <circle cx="382" cy="138" r="8" fill="#5B86C9"/>
</svg>
