name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download AutoHotkey v2 portable (from GitHub Releases)
        shell: powershell
        run: |
          $version = "2.0.26"
          $url = "https://github.com/AutoHotkey/AutoHotkey/releases/download/v$version/AutoHotkey_$version.zip"
          Write-Host "Downloading from $url"
          Invoke-WebRequest -Uri $url -OutFile "ahk-v2.zip"
          Expand-Archive -Path "ahk-v2.zip" -DestinationPath "ahk-v2"
          echo "AHK_DIR=$env:GITHUB_WORKSPACE\ahk-v2" >> $env:GITHUB_ENV

      - name: Compile with Ahk2Exe
        shell: powershell
        run: |
          & "$env:AHK_DIR\Compiler\Ahk2Exe.exe" `
            /in "CapsLock-.ahk" `
            /out "CapsLock-${{ github.ref_name }}.exe" `
            /icon "assets\CapsLock-.ico"

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: CapsLock-${{ github.ref_name }}.exe
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
