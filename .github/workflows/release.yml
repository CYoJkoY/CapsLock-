name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install ImageMagick for icon generation
        shell: pwsh
        run: |
          choco install imagemagick.app -y --no-progress
          if (-not (Get-Command magick.exe -ErrorAction SilentlyContinue)) {
            throw 'ImageMagick installation completed but magick.exe is not available on PATH.'
          }
          magick.exe --version

      - name: Generate high-resolution application icon
        shell: pwsh
        run: .\scripts\build_icon.ps1

      - name: Build (x86)
        uses: benmusson/ahk2exe-action@v1
        with:
          in: .\CapsLock-.ahk
          out: .\build\CapsLock-_x86.exe
          icon: .\assets\CapsLock-.ico
          target: x86
          compression: none
          ahk-tag: v2.0.27
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (x64)
        uses: benmusson/ahk2exe-action@v1
        with:
          in: .\CapsLock-.ahk
          out: .\build\CapsLock-.exe
          icon: .\assets\CapsLock-.ico
          target: x64
          compression: none
          ahk-tag: v2.0.27
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            .\build\CapsLock-_x86.exe
            .\build\CapsLock-.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
