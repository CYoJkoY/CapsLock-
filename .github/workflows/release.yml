name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download and extract AutoHotkey v2 portable
        shell: powershell
        run: |
          $version = "2.0.26"
          $url = "https://github.com/AutoHotkey/AutoHotkey/releases/download/v$version/AutoHotkey_$version.zip"

          Write-Host "Downloading from $url"
          Invoke-WebRequest -Uri $url -OutFile "ahk-v2.zip" -UseBasicParsing -ErrorAction Stop

          Write-Host "Extracting into ahk-v2 folder..."
          New-Item -ItemType Directory -Force -Path "ahk-v2" | Out-Null
          Expand-Archive -Path "ahk-v2.zip" -DestinationPath "ahk-v2" -ErrorAction Stop

          $ahkExe = Get-ChildItem -Path "ahk-v2" -Recurse -Filter "AutoHotkey.exe" | Select-Object -First 1
          if (-not $ahkExe) {
            throw "AutoHotkey.exe not found in ahk-v2/"
          }

          $ahkDir = Split-Path -Parent $ahkExe.FullName
          echo "AHK_DIR=$ahkDir" >> $env:GITHUB_ENV
          Write-Host "AHK_DIR set to $ahkDir"

          $installScript = Join-Path $ahkDir "UX\install-ahk2exe.ahk"
          if (-not (Test-Path $installScript)) {
            throw "install-ahk2exe.ahk not found at $installScript"
          }

          Write-Host "Running install-ahk2exe.ahk to download compiler..."
          & $ahkExe $installScript

      - name: Compile with Ahk2Exe
        shell: powershell
        run: |
          $ahkDir = $env:AHK_DIR
          $ahk2exe = Join-Path $ahkDir "Compiler\Ahk2Exe.exe"
          if (-not (Test-Path $ahk2exe)) {
            throw "Ahk2Exe.exe still not found after installation at $ahk2exe"
          }
          & $ahk2exe `
            /in "CapsLock-.ahk" `
            /out "CapsLock-${{ github.ref_name }}.exe" `
            /icon "assets\CapsLock-.ico"

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: CapsLock-${{ github.ref_name }}.exe
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
