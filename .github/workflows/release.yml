name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set AHK_DIR and create directory
        shell: powershell
        run: |
          $ahkDir = Join-Path $env:GITHUB_WORKSPACE "Ahk2Exe"
          New-Item -ItemType Directory -Force -Path $ahkDir | Out-Null
          echo "AHK_DIR=$ahkDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "AHK_DIR set to $ahkDir"

      - name: Download Ahk2Exe compiler
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ahkDir = $env:AHK_DIR
          $compilerDir = Join-Path $ahkDir "Compiler"
          New-Item -ItemType Directory -Force -Path $compilerDir | Out-Null

          $downloadUrl = "https://github.com/AutoHotkey/Ahk2Exe/releases/download/Ahk2Exe1.1.37.02a2/Ahk2Exe1.1.37.02a2.zip"
          Write-Host "Downloading Ahk2Exe from $downloadUrl"
          Invoke-WebRequest -Uri $downloadUrl -OutFile "Ahk2Exe.zip" -UseBasicParsing -ErrorAction Stop
          Expand-Archive -Path "Ahk2Exe.zip" -DestinationPath $compilerDir -Force -ErrorAction Stop
          Remove-Item "Ahk2Exe.zip"

          $ahk2exe = Join-Path $compilerDir "Ahk2Exe.exe"
          if (-not (Test-Path $ahk2exe)) { throw "Ahk2Exe.exe not found after download" }
          Write-Host "Ahk2Exe installed to $ahk2exe"

      - name: Compile with Ahk2Exe
        shell: powershell
        run: |
          $ahkDir = $env:AHK_DIR
          $ahk2exe = Join-Path $ahkDir "Compiler\Ahk2Exe.exe"
          if (-not (Test-Path $ahk2exe)) {
            throw "Ahk2Exe.exe still not found at $ahk2exe"
          }

          $iconPath = "assets\CapsLock-.ico"
          if (-not (Test-Path $iconPath)) {
            Write-Host "Warning: Icon file '$iconPath' not found"
          }

          $outFile = "CapsLock-${{ github.ref_name }}.exe"
          Write-Host "Compiling CapsLock-.ahk -> $outFile ..."

          # Direct invocation, capture all output streams
          $output = & $ahk2exe /in "CapsLock-.ahk" /out $outFile /icon $iconPath 2>&1
          $exitCode = $LASTEXITCODE

          if ($output) {
            Write-Host "=== Ahk2Exe Output ==="
            $output | ForEach-Object { Write-Host $_ }
          }

          Write-Host "Exit code: $exitCode"
          if ($exitCode -ne 0) {
            throw "Ahk2Exe compilation failed with exit code $exitCode"
          }

          if (-not (Test-Path $outFile)) {
            throw "Compiled executable $outFile not found"
          }
          Write-Host "Compilation successful: $outFile ($((Get-Item $outFile).Length) bytes)"

      - name: List files for debugging
        shell: powershell
        run: |
          Write-Host "=== Current directory contents ==="
          Get-ChildItem | Select-Object Name, Length
          Write-Host "=== Checking for CapsLock-*.exe ==="
          Get-ChildItem -Filter "CapsLock-*.exe" | ForEach-Object {
            Write-Host "Found: $($_.Name) (Size: $($_.Length) bytes)"
          }

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: CapsLock-${{ github.ref_name }}.exe
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
