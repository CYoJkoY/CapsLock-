name: Build and test .NET services

on:
  push:
    branches:
      - main
    paths:
      - 'src/CapsLockSharp/**'
      - 'tests/CapsLockSharp.Tests/**'
      - 'Core/Services.ahk'
      - 'Core/FileOperations.ahk'
      - 'History/**'
      - 'Config/**'
      - 'Tray/TraySettings.ahk'
      - 'UI/SettingsGui.ahk'
      - 'Utils/MethodsUtils.ahk'
      - 'CapsLock-.ahk'
      - 'scripts/perf/**'
      - 'scripts/ci/**'
      - '.github/workflows/dotnet.yml'
  pull_request:
    paths:
      - 'src/CapsLockSharp/**'
      - 'tests/CapsLockSharp.Tests/**'
      - 'Core/Services.ahk'
      - 'Core/FileOperations.ahk'
      - 'History/**'
      - 'Config/**'
      - 'Tray/TraySettings.ahk'
      - 'UI/SettingsGui.ahk'
      - 'Utils/MethodsUtils.ahk'
      - 'CapsLock-.ahk'
      - 'scripts/perf/**'
      - 'scripts/ci/**'
      - '.github/workflows/dotnet.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and verify optional C# backend (netstandard2.0, AnyCPU)
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build precompiled services
        shell: pwsh
        run: dotnet build src\CapsLockSharp\CapsLockSharp.csproj -c Release -o lib --nologo

      - name: Managed regression tests
        shell: pwsh
        run: dotnet run --project tests\CapsLockSharp.Tests -c Release -- --benchmark

      - name: Install AutoHotkey
        uses: holy-tao/install-autohotkey@37e2ba93564d85ce51426c4e77efcbda81b65c24
        with:
          version: '2.0.28'

      # AutoHotkey is a GUI-subsystem program: PowerShell neither waits for it
      # nor sets $LASTEXITCODE, so every AHK step goes through the wrapper.
      - name: Verify pure AHK and missing-backend fallback (x64 and x86)
        shell: pwsh
        run: |
          foreach ($arch in 'x64', 'x86') {
            .\scripts\ci\Invoke-Ahk.ps1 .\scripts\perf\ServiceEquivalence.ahk -Architecture $arch
          }

      - name: Checkout AHKSharp bridge (pinned, test dependency only)
        uses: actions/checkout@v4
        with:
          repository: owhs/AHKSharp
          ref: e3b895c7590eba47748b0ed963b7978c237d1daf
          path: lib/ahk#

      - name: Verify real AHK-to-C# boundary (x64 and x86)
        shell: pwsh
        run: |
          foreach ($arch in 'x64', 'x86') {
            .\scripts\ci\Invoke-Ahk.ps1 .\CapsLock-.ahk -Validate -Architecture $arch
            .\scripts\ci\Invoke-Ahk.ps1 .\scripts\perf\ServiceEquivalence.ahk -ScriptArguments '-CSharp' -Architecture $arch
          }

      - name: Upload the assembly
        uses: actions/upload-artifact@v4
        with:
          name: CapsLockSharp-netstandard2.0
          path: lib\CapsLockSharp.dll
          if-no-files-found: error
