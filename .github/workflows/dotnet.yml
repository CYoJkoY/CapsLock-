name: Build and test .NET services

on:
  push:
    branches:
      - main
    paths:
      - 'src/CapsLockSharp/**'
      - 'tests/CapsLockSharp.Tests/**'
      - 'Core/Services.ahk'
      - 'Core/FileOperations.ahk'
      - 'History/**'
      - 'Config/**'
      - 'Tray/TraySettings.ahk'
      - 'UI/SettingsGui.ahk'
      - 'Utils/MethodsUtils.ahk'
      - 'CapsLock-.ahk'
      - 'scripts/**'
      - '.github/workflows/dotnet.yml'
  pull_request:
    paths:
      - 'src/CapsLockSharp/**'
      - 'tests/CapsLockSharp.Tests/**'
      - 'Core/Services.ahk'
      - 'Core/FileOperations.ahk'
      - 'History/**'
      - 'Config/**'
      - 'Tray/TraySettings.ahk'
      - 'UI/SettingsGui.ahk'
      - 'Utils/MethodsUtils.ahk'
      - 'CapsLock-.ahk'
      - 'scripts/**'
      - '.github/workflows/dotnet.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and verify optional C# backend (netstandard2.0, AnyCPU)
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build precompiled services
        shell: pwsh
        run: dotnet build src\CapsLockSharp\CapsLockSharp.csproj -c Release -o lib --nologo

      - name: Managed regression tests
        shell: pwsh
        run: dotnet run --project tests\CapsLockSharp.Tests -c Release -- --benchmark

      - name: Install AutoHotkey
        uses: holy-tao/install-autohotkey@37e2ba93564d85ce51426c4e77efcbda81b65c24
        with:
          version: '2.0.28'

      # AutoHotkey is a GUI-subsystem program: PowerShell neither waits for it
      # nor sets $LASTEXITCODE, so every AHK step goes through the wrapper.
      - name: Verify pure AHK and missing-backend fallback (x64 and x86)
        shell: pwsh
        run: |
          foreach ($arch in 'x64', 'x86') {
            .\scripts\ci\Invoke-Ahk.ps1 .\scripts\perf\ServiceEquivalence.ahk -Architecture $arch -TimeoutSeconds 60
          }

      - name: Checkout AHKSharp bridge (pinned, test dependency only)
        uses: actions/checkout@v4
        with:
          repository: owhs/AHKSharp
          ref: e3b895c7590eba47748b0ed963b7978c237d1daf
          path: lib/ahk#

      - name: Verify real AHK-to-C# boundary (x64 and x86)
        shell: pwsh
        run: |
          foreach ($arch in 'x64', 'x86') {
            .\scripts\ci\Invoke-Ahk.ps1 .\CapsLock-.ahk -Validate -Architecture $arch -TimeoutSeconds 60
            .\scripts\ci\Invoke-Ahk.ps1 .\scripts\perf\ServiceEquivalence.ahk -ScriptArguments '-CSharp' -Architecture $arch
            .\scripts\ci\Invoke-Ahk.ps1 .\scripts\HistoryGuiPaging.ahk -ScriptArguments '-CSharp' -Architecture $arch
          }

      # Informational: shared GitHub-hosted runners are noisy and are not a
      # desktop. The step only has to prove the harness still runs; it asserts
      # nothing about the numbers. They are printed in the log, appended to the
      # run summary and uploaded below.
      - name: Windows baseline, x64 and x86 (informational)
        shell: pwsh
        run: |
          .\scripts\ci\Invoke-Ahk.ps1 .\scripts\perf\CapsLockProfile.ahk -TimeoutSeconds 540
          .\scripts\ci\Invoke-Ahk.ps1 .\scripts\perf\CapsLockProfile.ahk -Architecture x86 -ScriptArguments '-Out', '.\scripts\perf\results\x86' -TimeoutSeconds 540
          Get-ChildItem .\scripts\perf\results -Recurse -Filter baseline-*.md | ForEach-Object { Get-Content -LiteralPath $_.FullName -Raw } | Add-Content -Path $env:GITHUB_STEP_SUMMARY

      - name: Upload the baseline
        uses: actions/upload-artifact@v4
        with:
          name: perf-baseline-windows
          path: scripts/perf/results/
          if-no-files-found: error

      - name: Upload the assembly
        uses: actions/upload-artifact@v4
        with:
          name: CapsLockSharp-netstandard2.0
          path: lib\CapsLockSharp.dll
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # End-to-end packaging check.
  #
  # The jobs above only ever run the AHK sources. This one compiles a real EXE
  # with the C# payload embedded and lets that EXE unpack it and make one call
  # into the CLR, which is the only place the whole chain is exercised:
  # generated AddResource directives -> Ahk2Exe resources -> extraction by
  # Core\CSharpRuntime.ahk -> AHK# bridge hash check -> CLR boot -> managed call.
  # ---------------------------------------------------------------------------
  package:
    name: Package the C# backend into an EXE and probe it
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # The action also installs Ahk2Exe and reports its path, so the build uses
      # the same compiler a local `scripts\build.ps1` run finds.
      - name: Install AutoHotkey and the script compiler
        id: ahk
        uses: holy-tao/install-autohotkey@37e2ba93564d85ce51426c4e77efcbda81b65c24
        with:
          version: '2.0.28'
          compiler: 'latest'

      # Provisions lib\, writes CSharpPayload.ahk, compiles with Ahk2Exe and
      # then reads the resource directory of the result.
      - name: Build the EXE with the packaged C# backend
        shell: pwsh
        run: .\scripts\build.ps1 -Architecture both -Ahk2Exe '${{ steps.ahk.outputs.ahk2Exe }}'

      # -ProbeCSharp extracts the payload, starts the CLR and performs one real
      # managed call before exiting. The wrapper waits for the process, prints
      # its stdout and fails on a non-zero exit code.
      - name: Probe the packaged payload (x64 and x86)
        shell: pwsh
        run: |
          .\scripts\ci\Invoke-Ahk.ps1 .\build\CapsLock-.exe -Compiled -ScriptArguments '-ProbeCSharp' -TimeoutSeconds 180
          .\scripts\ci\Invoke-Ahk.ps1 .\build\CapsLock-_x86.exe -Compiled -ScriptArguments '-ProbeCSharp' -TimeoutSeconds 180

      - name: Upload the packaged executables
        uses: actions/upload-artifact@v4
        with:
          name: CapsLock-packaged-exe
          path: |
            build\CapsLock-.exe
            build\CapsLock-_x86.exe
          if-no-files-found: error
