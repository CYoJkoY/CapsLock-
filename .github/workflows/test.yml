name: AutoHotkey Syntax Check

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: capslock-syntax-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  syntax:
    name: AutoHotkey Syntax Check
    runs-on: windows-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install AutoHotkey
        uses: holy-tao/install-autohotkey@37e2ba93564d85ce51426c4e77efcbda81b65c24
        with:
          version: '2.0.28'

      - name: Validate AutoHotkey source
        shell: pwsh
        timeout-minutes: 2
        run: .\autohotkey\AutoHotkey64.exe /ErrorStdOut /Validate .\CapsLock-.ahk
