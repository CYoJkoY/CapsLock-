name: Regression Tests

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: capslock-regression-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  regression:
    name: Regression Tests
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install AutoHotkey
        uses: holy-tao/install-autohotkey@37e2ba93564d85ce51426c4e77efcbda81b65c24
        with:
          version: '2.0.28'

      - name: Run regression tests
        shell: pwsh
        run: .\autohotkey\AutoHotkey64.exe .\tests\RegressionTests.ahk

      - name: Run Cloud Sync regression tests
        shell: pwsh
        run: .\autohotkey\AutoHotkey64.exe .\tests\CloudSyncRegressionTests.ahk

  compile:
    name: Compile (${{ matrix.target }})
    runs-on: windows-latest
    timeout-minutes: 8
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x64
            output: build\CapsLock-._ci.exe
          - target: x86
            output: build\CapsLock-_ci_x86.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile AutoHotkey script
        uses: benmusson/ahk2exe-action@v1
        with:
          in: .\CapsLock-.ahk
          out: .\${{ matrix.output }}
          target: ${{ matrix.target }}
          compression: none
          ahk-tag: v2.0.28
          ahk2exe-tag: Ahk2Exe1.1.37.02a2
          build-assets-folder: .\.ahk2exe-v2-action
          github-token: ${{ secrets.GITHUB_TOKEN }}
