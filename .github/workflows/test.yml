name: Regression Tests

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: capslock-regression-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  regression:
    name: Regression Tests
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install AutoHotkey
        uses: holy-tao/install-autohotkey@37e2ba93564d85ce51426c4e77efcbda81b65c24
        with:
          version: '2.0.28'

      - name: Run regression tests
        shell: pwsh
        run: |
          $root = (Get-Location).Path
          function Invoke-AhkTest([string]$relativeScript) {
            $exe = Join-Path $root "autohotkey\AutoHotkey64.exe"
            $script = Join-Path $root $relativeScript

            $psi = New-Object System.Diagnostics.ProcessStartInfo
            $psi.FileName = $exe
            $psi.Arguments = '"' + $script + '"'
            $psi.WorkingDirectory = $root
            $psi.UseShellExecute = $false

            $process = New-Object System.Diagnostics.Process
            $process.StartInfo = $psi

            if (-not $process.Start()) {
              throw "Failed to start AutoHotkey test: $relativeScript"
            }

            if (-not $process.WaitForExit(60000)) {
              try { $process.Kill() } catch {}
              throw "AutoHotkey test timed out after 60 seconds: $relativeScript"
            }

            $exitCode = $process.ExitCode
            $process.Dispose()

            if ($exitCode -ne 0) {
              throw "AutoHotkey test failed with exit code $exitCode: $relativeScript"
            }
          }

          Invoke-AhkTest "tests\RegressionTests.ahk"

      - name: Run Cloud Sync regression tests
        shell: pwsh
        run: |
          $root = (Get-Location).Path
          function Invoke-AhkTest([string]$relativeScript) {
            $exe = Join-Path $root "autohotkey\AutoHotkey64.exe"
            $script = Join-Path $root $relativeScript
            $psi = New-Object System.Diagnostics.ProcessStartInfo
            $psi.FileName = $exe
            $psi.Arguments = '"' + $script + '"'
            $psi.WorkingDirectory = $root
            $psi.UseShellExecute = $false
            $process = New-Object System.Diagnostics.Process
            $process.StartInfo = $psi
            if (-not $process.Start()) { throw "Failed to start AutoHotkey test: $relativeScript" }
            if (-not $process.WaitForExit(60000)) {
              try { $process.Kill() } catch {}
              throw "AutoHotkey test timed out after 60 seconds: $relativeScript"
            }
            $exitCode = $process.ExitCode
            $process.Dispose()
            if ($exitCode -ne 0) { throw "AutoHotkey test failed with exit code $exitCode: $relativeScript" }
          }
          Invoke-AhkTest "tests\CloudSyncRegressionTests.ahk"

      - name: Run Quick Phrase regression tests
        shell: pwsh
        run: |
          $root = (Get-Location).Path
          function Invoke-AhkTest([string]$relativeScript) {
            $exe = Join-Path $root "autohotkey\AutoHotkey64.exe"
            $script = Join-Path $root $relativeScript
            $psi = New-Object System.Diagnostics.ProcessStartInfo
            $psi.FileName = $exe
            $psi.Arguments = '"' + $script + '"'
            $psi.WorkingDirectory = $root
            $psi.UseShellExecute = $false
            $process = New-Object System.Diagnostics.Process
            $process.StartInfo = $psi
            if (-not $process.Start()) { throw "Failed to start AutoHotkey test: $relativeScript" }
            if (-not $process.WaitForExit(60000)) {
              try { $process.Kill() } catch {}
              throw "AutoHotkey test timed out after 60 seconds: $relativeScript"
            }
            $exitCode = $process.ExitCode
            $process.Dispose()
            if ($exitCode -ne 0) { throw "AutoHotkey test failed with exit code $exitCode: $relativeScript" }
          }
          Invoke-AhkTest "tests\QuickPhraseRegressionTests.ahk"

      - name: Run Quick Phrase target regression tests
        shell: pwsh
        run: |
          $root = (Get-Location).Path
          function Invoke-AhkTest([string]$relativeScript) {
            $exe = Join-Path $root "autohotkey\AutoHotkey64.exe"
            $script = Join-Path $root $relativeScript
            $psi = New-Object System.Diagnostics.ProcessStartInfo
            $psi.FileName = $exe
            $psi.Arguments = '"' + $script + '"'
            $psi.WorkingDirectory = $root
            $psi.UseShellExecute = $false
            $process = New-Object System.Diagnostics.Process
            $process.StartInfo = $psi
            if (-not $process.Start()) { throw "Failed to start AutoHotkey test: $relativeScript" }
            if (-not $process.WaitForExit(60000)) {
              try { $process.Kill() } catch {}
              throw "AutoHotkey test timed out after 60 seconds: $relativeScript"
            }
            $exitCode = $process.ExitCode
            $process.Dispose()
            if ($exitCode -ne 0) { throw "AutoHotkey test failed with exit code $exitCode: $relativeScript" }
          }
          Invoke-AhkTest "tests\QuickPhraseTargetRegressionTests.ahk"
