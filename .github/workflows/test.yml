name: Regression Tests

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install AutoHotkey
        uses: holy-tao/install-autohotkey@37e2ba93564d85ce51426c4e77efcbda81b65c24
        with:
          version: '2.0.27'

      - name: Run regression tests
        shell: pwsh
        run: .\autohotkey\AutoHotkey64.exe .\tests\RegressionTests.ahk

      - name: Run Cloud Sync regression tests
        shell: pwsh
        run: .\autohotkey\AutoHotkey64.exe .\tests\CloudSyncRegressionTests.ahk

      - name: Diagnose Cloud Sync load
        shell: pwsh
        run: |
          $root = (Get-Location).Path
          $ahk = Join-Path $root "autohotkey\\AutoHotkey64.exe"
          $main = Join-Path $root "CapsLock-.ahk"
          $mainLines = Get-Content -LiteralPath $main
          $providers = @(
            "Core\\Providers\\GitHubGistProvider.ahk",
            "Core\\Providers\\GitHubRepositoryProvider.ahk",
            "Core\\Providers\\GoogleOAuth.ahk",
            "Core\\Providers\\GoogleDriveProvider.ahk",
            "Core\\Providers\\OneDriveOAuth.ahk",
            "Core\\Providers\\OneDriveProvider.ahk",
            "Core\\Providers\\WebDavProvider.ahk"
          )

          $baseLines = @()
          foreach ($line in $mainLines) {
            $isProviderInclude = $false
            foreach ($provider in $providers) {
              if ($line.Trim() -eq ('#Include "' + $provider + '"')) {
                $isProviderInclude = $true
                break
              }
            }
            if (-not $isProviderInclude) {
              $baseLines += $line
            }
          }

          function Test-MainVariant($name, $provider) {
            $lines = @($baseLines)
            if ($provider) {
              $insertAt = -1
              for ($i = 0; $i -lt $lines.Count; $i++) {
                if ($lines[$i].Trim() -eq '#Include "Core\\CloudSyncCoordinator.ahk"') {
                  $insertAt = $i + 1
                  break
                }
              }
              if ($insertAt -lt 0) { throw "Could not locate CloudSyncCoordinator include." }
              $lines = @($lines[0..($insertAt-1)] + ('#Include "' + $provider + '"') + $lines[$insertAt..($lines.Count-1)])
            }

            $probe = Join-Path $env:RUNNER_TEMP ("cloudsync-main-" + $name + ".ahk")
            $stderr = Join-Path $env:RUNNER_TEMP ("cloudsync-main-" + $name + ".stderr")
            Set-Content -LiteralPath $probe -Value $lines -Encoding utf8

            $process = Start-Process -FilePath $ahk -ArgumentList @("/validate", "/ErrorStdOut=UTF-8", $probe) -PassThru -RedirectStandardError $stderr
            if (-not $process.WaitForExit(15000)) {
              try { $process.Kill() } catch {}
              throw "Full-context load validation timed out: $name"
            }
            if ($process.ExitCode -ne 0) {
              $detail = if (Test-Path -LiteralPath $stderr) { Get-Content -LiteralPath $stderr -Raw } else { "" }
              throw "Full-context load validation failed: $name (exit code $($process.ExitCode)) $detail"
            }
            Write-Host "Full-context load validation passed: $name"
          }

          Test-MainVariant "no-providers" ""
          foreach ($provider in $providers) {
            $name = [IO.Path]::GetFileNameWithoutExtension($provider)
            Test-MainVariant $name $provider
          }

      - name: Compile main AHK script (x64)
        uses: benmusson/ahk2exe-action@v1
        with:
          in: .\CapsLock-.ahk
          out: .\build\CapsLock-._ci.exe
          target: x64
          compression: none
          ahk-tag: v2.0.27
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Compile main AHK script (x86)
        uses: benmusson/ahk2exe-action@v1
        with:
          in: .\CapsLock-.ahk
          out: .\build\CapsLock-_ci_x86.exe
          target: x86
          compression: none
          ahk-tag: v2.0.27
          github-token: ${{ secrets.GITHUB_TOKEN }}
