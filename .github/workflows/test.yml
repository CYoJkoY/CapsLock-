name: Regression Tests

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install AutoHotkey
        uses: holy-tao/install-autohotkey@37e2ba93564d85ce51426c4e77efcbda81b65c24
        with:
          version: '2.0.27'

      - name: Run regression tests
        shell: pwsh
        run: .\autohotkey\AutoHotkey64.exe .\tests\RegressionTests.ahk

      - name: Run Cloud Sync regression tests
        shell: pwsh
        run: .\autohotkey\AutoHotkey64.exe .\tests\CloudSyncRegressionTests.ahk

      - name: Diagnose AHK validation hang
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ahk = (Resolve-Path ".\autohotkey\AutoHotkey64.exe").Path
          $source = Get-Content ".\CapsLock-.ahk" -Raw

          $newIncludes = @(
            "Utils\Json.ahk", "Utils\Hash.ahk", "Utils\Base64.ahk",
            "Utils\Random.ahk", "Utils\HttpClient.ahk", "Utils\SecureStorage.ahk",
            "Core\CloudSyncIdentity.ahk", "Core\CloudSyncCredentials.ahk",
            "Core\CloudSyncState.ahk", "Core\CloudSyncModel.ahk",
            "Core\CloudSyncSerializer.ahk", "Core\CloudSyncMerger.ahk",
            "Core\CloudSyncStorage.ahk", "Core\CloudSyncProvider.ahk",
            "Core\CloudSyncProviderFactory.ahk", "Core\CloudSyncCoordinator.ahk",
            "Core\Providers\GitHubGistProvider.ahk",
            "Core\Providers\GitHubRepositoryProvider.ahk",
            "Core\Providers\GoogleOAuth.ahk",
            "Core\Providers\GoogleDriveProvider.ahk",
            "Core\Providers\OneDriveOAuth.ahk",
            "Core\Providers\OneDriveProvider.ahk",
            "Core\Providers\WebDavProvider.ahk",
            "UI\CloudSyncGui.ahk", "UI\CloudSyncConflictGui.ahk"
          )

          function Test-Source([string]$name, [string[]]$includes) {
            $candidate = $source
            $selected = [System.Collections.Generic.HashSet[string]]::new()
            foreach ($item in $includes) { [void]$selected.Add($item) }
            foreach ($item in $newIncludes) {
              if (-not $selected.Contains($item)) {
                $pattern = "(?m)^\s*#Include ""{0}""\s*\r?\n" -f [regex]::Escape($item)
                $candidate = [regex]::Replace($candidate, $pattern, "")
              }
            }

            $probe = Join-Path (Get-Location) ".capslock-validation-$name.ahk"
            $stdout = Join-Path $env:RUNNER_TEMP "$name.stdout"
            $stderr = Join-Path $env:RUNNER_TEMP "$name.stderr"
            Set-Content -LiteralPath $probe -Value $candidate -Encoding UTF8
            Remove-Item -LiteralPath $stdout,$stderr -Force -ErrorAction SilentlyContinue

            $process = Start-Process -FilePath $ahk `
              -ArgumentList @("/validate", "/ErrorStdOut=UTF-8", $probe) `
              -PassThru `
              -RedirectStandardOutput $stdout `
              -RedirectStandardError $stderr

            if (-not $process.WaitForExit(15000)) {
              Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
              return "TIMEOUT"
            }

            [string]$err = if (Test-Path -LiteralPath $stderr) { Get-Content -LiteralPath $stderr -Raw } else { "" }
            [string]$out = if (Test-Path -LiteralPath $stdout) { Get-Content -LiteralPath $stdout -Raw } else { "" }
            if ($err.Trim() -ne "") { Write-Host "stderr: $err" }
            if ($out.Trim() -ne "") { Write-Host "stdout: $out" }
            if ($process.ExitCode -eq 0) { return "PASS" }
            return "FAIL:$($process.ExitCode)"
          }

          $baseline = Test-Source "baseline" @()
          Write-Host "Baseline: $baseline"
          if ($baseline -ne "PASS") { throw "Baseline source does not pass AHK /validate." }

          foreach ($item in $newIncludes) {
            $result = Test-Source ("single-" + ($item -replace "[^A-Za-z0-9]", "_")) @($item)
            Write-Host "Single include [$item]: $result"
            if ($result -eq "TIMEOUT") {
              throw "Single include reproduces AHK /validate hang: $item"
            }
          }

          $full = Test-Source "full" $newIncludes
          Write-Host "Full Cloud Sync Include set: $full"
          if ($full -ne "TIMEOUT") {
            throw "Expected the full Cloud Sync Include set to reproduce the validation hang; got $full"
          }
          Write-Host "Full set hangs, but no single new Include hangs. A combination is responsible."

