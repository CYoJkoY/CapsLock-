name: AutoHotkey Syntax Check

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: capslock-syntax-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  syntax:
    name: AutoHotkey Syntax Check
    runs-on: windows-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install AutoHotkey
        uses: holy-tao/install-autohotkey@37e2ba93564d85ce51426c4e77efcbda81b65c24
        with:
          version: '2.0.28'

      # AutoHotkey is a GUI-subsystem program: PowerShell neither waits for it,
      # captures its output nor sets $LASTEXITCODE, so calling it directly makes
      # a step pass before the script has even run. The wrapper waits, prints
      # stdout/stderr, enforces a timeout and fails on a non-zero exit code.
      - name: Validate AutoHotkey source
        shell: pwsh
        timeout-minutes: 2
        run: .\scripts\ci\Invoke-Ahk.ps1 .\CapsLock-.ahk -Validate -TimeoutSeconds 60

      - name: Hotkey regression checks
        shell: pwsh
        timeout-minutes: 2
        run: .\scripts\ci\Invoke-Ahk.ps1 .\scripts\HotkeyRegression.ahk -TimeoutSeconds 90

      - name: Service fallback regression checks
        shell: pwsh
        timeout-minutes: 2
        run: .\scripts\ci\Invoke-Ahk.ps1 .\scripts\perf\ServiceEquivalence.ahk -TimeoutSeconds 90
