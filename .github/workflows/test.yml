name: Regression Tests

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: capslock-regression-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  regression:
    name: Regression Tests
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install AutoHotkey
        uses: holy-tao/install-autohotkey@37e2ba93564d85ce51426c4e77efcbda81b65c24
        with:
          version: '2.0.28'

      - name: Run AutoHotkey regression tests
        shell: pwsh
        run: |
          $root = (Get-Location).Path

          function Invoke-AhkTest([string]$relativeScript) {
            $exe = Join-Path $root "autohotkey\AutoHotkey64.exe"
            $script = Join-Path $root $relativeScript
            $result = Join-Path $env:RUNNER_TEMP ("capslock-ahk-" + [Guid]::NewGuid().ToString("N") + ".result")

            if (-not (Test-Path -LiteralPath $exe)) {
              throw "AutoHotkey executable not found: $exe"
            }

            if (-not (Test-Path -LiteralPath $script)) {
              throw "AutoHotkey test script not found: $script"
            }

            $psi = New-Object System.Diagnostics.ProcessStartInfo
            $psi.FileName = $exe
            $psi.Arguments = '"' + $script + '" "' + $result + '"'
            $psi.WorkingDirectory = $root
            $psi.UseShellExecute = $false
            $psi.CreateNoWindow = $true

            $process = New-Object System.Diagnostics.Process
            $process.StartInfo = $psi

            try {
              if (-not $process.Start()) {
                throw "Failed to start AutoHotkey test: $relativeScript"
              }

              $deadline = [DateTime]::UtcNow.AddSeconds(60)

              while (-not (Test-Path -LiteralPath $result)) {
                if ($process.HasExited) {
                  $exitCode = $process.ExitCode
                  throw ("AutoHotkey test exited before reporting a result (exit code {0}): {1}" -f $exitCode, $relativeScript)
                }

                if ([DateTime]::UtcNow -ge $deadline) {
                  try { $process.Kill() } catch {}
                  throw "AutoHotkey test timed out after 60 seconds: $relativeScript"
                }

                Start-Sleep -Milliseconds 100
              }

              $payload = Get-Content -LiteralPath $result -Raw -Encoding UTF8
              $lines = $payload -split "\r?\n", 2
              $status = $lines[0].Trim()
              $message = if ($lines.Count -gt 1) { $lines[1].Trim() } else { "" }

              if ($status -ne "PASS") {
                if ($message -ne "") {
                  throw ("AutoHotkey test reported failure: {0}`n{1}" -f $relativeScript, $message)
                }
                throw "AutoHotkey test reported failure: $relativeScript"
              }

              $exitDeadline = [DateTime]::UtcNow.AddSeconds(5)
              while (-not $process.HasExited -and [DateTime]::UtcNow -lt $exitDeadline) {
                Start-Sleep -Milliseconds 50
              }

              if (-not $process.HasExited) {
                try { $process.Kill() } catch {}
                throw "AutoHotkey test reported PASS but did not exit promptly: $relativeScript"
              }
            } finally {
              try { $process.Dispose() } catch {}
              Remove-Item -LiteralPath $result -Force -ErrorAction SilentlyContinue
            }
          }

          @(
            "tests\RegressionTests.ahk"
            "tests\CloudSyncRegressionTests.ahk"
            "tests\QuickPhraseRegressionTests.ahk"
            "tests\QuickPhraseTargetRegressionTests.ahk"
          ) | ForEach-Object {
            Invoke-AhkTest $_
          }
