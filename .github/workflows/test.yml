name: Regression Tests

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install AutoHotkey
        uses: holy-tao/install-autohotkey@37e2ba93564d85ce51426c4e77efcbda81b65c24
        with:
          version: '2.0.27'

      - name: Run regression tests
        shell: pwsh
        run: .\autohotkey\AutoHotkey64.exe .\tests\RegressionTests.ahk

      - name: Run Cloud Sync regression tests
        shell: pwsh
        run: .\autohotkey\AutoHotkey64.exe .\tests\CloudSyncRegressionTests.ahk

      - name: Diagnose Cloud Sync load
        shell: pwsh
        run: |
          $root = (Get-Location).Path
          $ahk = Join-Path $root "autohotkey\\AutoHotkey64.exe"

          $groups = @{
            "utils" = @(
              "Utils\\Json.ahk", "Utils\\Hash.ahk", "Utils\\Base64.ahk",
              "Utils\\Random.ahk", "Utils\\HttpClient.ahk", "Utils\\SecureStorage.ahk"
            )
            "core" = @(
              "Core\\CloudSyncIdentity.ahk", "Core\\CloudSyncCredentials.ahk",
              "Core\\CloudSyncState.ahk", "Core\\CloudSyncModel.ahk",
              "Core\\CloudSyncSerializer.ahk", "Core\\CloudSyncMerger.ahk",
              "Core\\CloudSyncStorage.ahk", "Core\\CloudSyncProvider.ahk",
              "Core\\CloudSyncProviderFactory.ahk", "Core\\CloudSyncCoordinator.ahk"
            )
            "provider-gist" = @("Core\\CloudSyncProvider.ahk", "Core\\Providers\\GitHubGistProvider.ahk")
            "provider-github" = @("Core\\CloudSyncProvider.ahk", "Core\\Providers\\GitHubRepositoryProvider.ahk")
            "provider-google-oauth" = @("Core\\CloudSyncProvider.ahk", "Core\\Providers\\GoogleOAuth.ahk")
            "provider-google-drive" = @("Core\\CloudSyncProvider.ahk", "Core\\Providers\\GoogleDriveProvider.ahk")
            "provider-onedrive-oauth" = @("Core\\CloudSyncProvider.ahk", "Core\\Providers\\OneDriveOAuth.ahk")
            "provider-onedrive" = @("Core\\CloudSyncProvider.ahk", "Core\\Providers\\OneDriveProvider.ahk")
            "provider-webdav" = @("Core\\CloudSyncProvider.ahk", "Core\\Providers\\WebDavProvider.ahk")
            "ui" = @(
              "UI\\CloudSyncGui.ahk", "UI\\CloudSyncConflictGui.ahk"
            )
            "cloud-all" = @(
              "Utils\\Json.ahk", "Utils\\Hash.ahk", "Utils\\Base64.ahk",
              "Utils\\Random.ahk", "Utils\\HttpClient.ahk", "Utils\\SecureStorage.ahk",
              "Core\\CloudSyncIdentity.ahk", "Core\\CloudSyncCredentials.ahk",
              "Core\\CloudSyncState.ahk", "Core\\CloudSyncModel.ahk",
              "Core\\CloudSyncSerializer.ahk", "Core\\CloudSyncMerger.ahk",
              "Core\\CloudSyncStorage.ahk", "Core\\CloudSyncProvider.ahk",
              "Core\\CloudSyncProviderFactory.ahk", "Core\\CloudSyncCoordinator.ahk",
              "Core\\Providers\\GitHubGistProvider.ahk",
              "Core\\Providers\\GitHubRepositoryProvider.ahk",
              "Core\\Providers\\GoogleOAuth.ahk",
              "Core\\Providers\\GoogleDriveProvider.ahk",
              "Core\\Providers\\OneDriveOAuth.ahk",
              "Core\\Providers\\OneDriveProvider.ahk",
              "Core\\Providers\\WebDavProvider.ahk",
              "UI\\CloudSyncGui.ahk", "UI\\CloudSyncConflictGui.ahk"
            )
          }

          foreach ($name in $groups.Keys) {
            $probe = Join-Path $env:RUNNER_TEMP ("cloudsync-validate-" + $name + ".ahk")
            $lines = @("#Requires AutoHotkey v2.0")
            foreach ($path in $groups[$name]) {
              $full = Join-Path $root $path
              if (-not (Test-Path -LiteralPath $full)) { throw "Probe file missing: $path" }
              $lines += '#Include "' + $full + '"'
            }
            Set-Content -LiteralPath $probe -Value $lines -Encoding utf8

            $stderr = Join-Path $env:RUNNER_TEMP ("cloudsync-validate-" + $name + ".stderr")
            $process = Start-Process -FilePath $ahk -ArgumentList @("/validate", "/ErrorStdOut=UTF-8", $probe) -PassThru -RedirectStandardError $stderr
            if (-not $process.WaitForExit(15000)) {
              try { $process.Kill() } catch {}
              throw "Cloud Sync load validation timed out: $name"
            }
            if ($process.ExitCode -ne 0) {
              $detail = if (Test-Path -LiteralPath $stderr) { Get-Content -LiteralPath $stderr -Raw } else { "" }
              throw "Cloud Sync load validation failed: $name (exit code $($process.ExitCode)) $detail"
            }
            Write-Host "Cloud Sync load validation passed: $name"
          }

      - name: Compile main AHK script (x64)
        uses: benmusson/ahk2exe-action@v1
        with:
          in: .\CapsLock-.ahk
          out: .\build\CapsLock-._ci.exe
          target: x64
          compression: none
          ahk-tag: v2.0.27
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Compile main AHK script (x86)
        uses: benmusson/ahk2exe-action@v1
        with:
          in: .\CapsLock-.ahk
          out: .\build\CapsLock-_ci_x86.exe
          target: x86
          compression: none
          ahk-tag: v2.0.27
          github-token: ${{ secrets.GITHUB_TOKEN }}
