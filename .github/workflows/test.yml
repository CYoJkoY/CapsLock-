name: Regression Tests

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install AutoHotkey
        uses: holy-tao/install-autohotkey@37e2ba93564d85ce51426c4e77efcbda81b65c24
        with:
          version: '2.0.28'

      - name: Run regression tests
        shell: pwsh
        run: .\autohotkey\AutoHotkey64.exe .\tests\RegressionTests.ahk

      - name: Run Cloud Sync regression tests
        shell: pwsh
        run: .\autohotkey\AutoHotkey64.exe .\tests\CloudSyncRegressionTests.ahk

      - name: Download Ahk2Exe
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $url = "https://github.com/AutoHotkey/Ahk2Exe/releases/download/Ahk2Exe1.1.37.02a2/Ahk2Exe1.1.37.02a2.zip"
          $archive = Join-Path $env:RUNNER_TEMP "Ahk2Exe.zip"
          $dir = Join-Path $env:RUNNER_TEMP "Ahk2Exe"
          Invoke-WebRequest -Uri $url -OutFile $archive
          Expand-Archive -Path $archive -DestinationPath $dir -Force
          $compiler = Get-ChildItem -Path $dir -Recurse -Filter "Ahk2Exe.exe" | Select-Object -First 1
          if (-not $compiler) { throw "Ahk2Exe.exe was not found after extraction." }
          "AHK2EXE_PATH=$($compiler.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Using Ahk2Exe: $($compiler.FullName)"

      - name: Compile main AHK script (x64)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $output = Join-Path $env:GITHUB_WORKSPACE "build\CapsLock-._ci.exe"
          New-Item -ItemType Directory -Path (Split-Path $output -Parent) -Force | Out-Null

          $base = (Resolve-Path ".\autohotkey\AutoHotkey64.exe").Path
          $compiler = $env:AHK2EXE_PATH
          $args = @(
            "/silent", "verbose",
            "/in", (Resolve-Path ".\CapsLock-.ahk").Path,
            "/out", $output,
            "/base", $base,
            "/compress", "0"
          )

          $process = Start-Process -FilePath $compiler -ArgumentList $args -PassThru -Wait -NoNewWindow
          if ($process.ExitCode -ne 0) {
            throw "x64 compilation failed with exit code $($process.ExitCode)."
          }
          if (-not (Test-Path -LiteralPath $output)) {
            throw "x64 compilation completed without producing $output."
          }
          Write-Host "x64 compilation succeeded: $output ($((Get-Item $output).Length) bytes)"

      - name: Compile main AHK script (x86)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $output = Join-Path $env:GITHUB_WORKSPACE "build\CapsLock-_ci_x86.exe"

          $base = (Resolve-Path ".\autohotkey\AutoHotkey32.exe").Path
          $compiler = $env:AHK2EXE_PATH
          $args = @(
            "/silent", "verbose",
            "/in", (Resolve-Path ".\CapsLock-.ahk").Path,
            "/out", $output,
            "/base", $base,
            "/compress", "0"
          )

          $process = Start-Process -FilePath $compiler -ArgumentList $args -PassThru -Wait -NoNewWindow
          if ($process.ExitCode -ne 0) {
            throw "x86 compilation failed with exit code $($process.ExitCode)."
          }
          if (-not (Test-Path -LiteralPath $output)) {
            throw "x86 compilation completed without producing $output."
          }
          Write-Host "x86 compilation succeeded: $output ($((Get-Item $output).Length) bytes)"
