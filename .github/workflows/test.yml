name: Regression Tests

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: capslock-regression-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  regression:
    name: Regression Tests
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install AutoHotkey
        uses: holy-tao/install-autohotkey@37e2ba93564d85ce51426c4e77efcbda81b65c24
        with:
          version: '2.0.28'

      - name: Run AutoHotkey regression tests
        shell: pwsh
        run: |
          $root = (Get-Location).Path

          function Invoke-AhkTest([string]$relativeScript) {
            $exe = Join-Path $root "autohotkey\AutoHotkey64.exe"
            $script = Join-Path $root $relativeScript

            if (-not (Test-Path -LiteralPath $exe)) {
              throw "AutoHotkey executable not found: $exe"
            }

            if (-not (Test-Path -LiteralPath $script)) {
              throw "AutoHotkey test script not found: $script"
            }

            $psi = New-Object System.Diagnostics.ProcessStartInfo
            $psi.FileName = $exe
            $psi.Arguments = '"' + $script + '"'
            $psi.WorkingDirectory = $root
            $psi.UseShellExecute = $false
            $psi.CreateNoWindow = $true

            $process = New-Object System.Diagnostics.Process
            $process.StartInfo = $psi

            try {
              if (-not $process.Start()) {
                throw "Failed to start AutoHotkey test: $relativeScript"
              }

              $deadline = [DateTime]::UtcNow.AddSeconds(60)

              while (-not $process.HasExited) {
                if ([DateTime]::UtcNow -ge $deadline) {
                  try { $process.Kill() } catch {}
                  throw "AutoHotkey test timed out after 60 seconds: $relativeScript"
                }

                Start-Sleep -Milliseconds 100
              }

              $exitCode = $process.ExitCode

              if ($exitCode -ne 0) {
                throw "AutoHotkey test failed with exit code ${exitCode}: $relativeScript"
              }
            } finally {
              $process.Dispose()
            }
          }

          @(
            "tests\RegressionTests.ahk"
            "tests\CloudSyncRegressionTests.ahk"
            "tests\QuickPhraseRegressionTests.ahk"
            "tests\QuickPhraseTargetRegressionTests.ahk"
          ) | ForEach-Object {
            Invoke-AhkTest $_
          }
