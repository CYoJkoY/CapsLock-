name: Regression Tests

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install AutoHotkey
        uses: holy-tao/install-autohotkey@37e2ba93564d85ce51426c4e77efcbda81b65c24
        with:
          version: '2.0.27'

      - name: Run regression tests
        shell: pwsh
        run: .\autohotkey\AutoHotkey64.exe .\tests\RegressionTests.ahk

      - name: Run Cloud Sync regression tests
        shell: pwsh
        run: .\autohotkey\AutoHotkey64.exe .\tests\CloudSyncRegressionTests.ahk

      - name: Validate main AHK script
        shell: pwsh
        run: |
          $root = (Get-Location).Path
          $ahk = Join-Path $root "autohotkey\\AutoHotkey64.exe"
          $main = Join-Path $root "CapsLock-.ahk"
          $stderr = Join-Path $env:RUNNER_TEMP "capslock-validate.stderr"

          & $ahk /validate /ErrorStdOut=UTF-8 $main 2> $stderr
          $exitCode = $LASTEXITCODE
          if (Test-Path -LiteralPath $stderr) {
            $detail = Get-Content -LiteralPath $stderr -Raw
            if ($detail.Trim() -ne "") {
              Write-Host $detail
            }
          }
          if ($exitCode -ne 0) {
            throw "AutoHotkey validation failed with exit code $exitCode."
          }

      - name: Compile main AHK script (x64)
        uses: benmusson/ahk2exe-action@v1
        with:
          in: .\CapsLock-.ahk
          out: .\build\CapsLock-._ci.exe
          target: x64
          compression: none
          ahk-tag: v2.0.27
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Compile main AHK script (x86)
        uses: benmusson/ahk2exe-action@v1
        with:
          in: .\CapsLock-.ahk
          out: .\build\CapsLock-_ci_x86.exe
          target: x86
          compression: none
          ahk-tag: v2.0.27
          github-token: ${{ secrets.GITHUB_TOKEN }}
