name: Regression Tests

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install AutoHotkey
        uses: holy-tao/install-autohotkey@37e2ba93564d85ce51426c4e77efcbda81b65c24
        with:
          version: '2.0.27'

      - name: Run regression tests
        shell: pwsh
        run: .\autohotkey\AutoHotkey64.exe .\tests\RegressionTests.ahk

      - name: Run Cloud Sync regression tests
        shell: pwsh
        run: .\autohotkey\AutoHotkey64.exe .\tests\CloudSyncRegressionTests.ahk

      - name: Diagnose Cloud Sync load
        shell: pwsh
        run: |
          $root = (Get-Location).Path
          $ahk = Join-Path $root "autohotkey\\AutoHotkey64.exe"

          $sourcePath = Join-Path $root "Core\\Providers\\OneDriveOAuth.ahk"
          $sourceLines = Get-Content -LiteralPath $sourcePath
          $header = $sourceLines[0..8]
          $methodRanges = @{
            "onedrive-authorize" = @(9, 68)
            "onedrive-access-token" = @(70, 87)
            "onedrive-refresh-token" = @(89, 140)
            "onedrive-poll" = @(142, 221)
            "onedrive-finish" = @(223, 241)
            "onedrive-disconnect" = @(243, 248)
          }

          foreach ($name in $methodRanges.Keys) {
            $range = $methodRanges[$name]
            $lines = @()
            $lines += $header
            $lines += $sourceLines[$range[0]..$range[1]]
            $lines += "}"
            $probe = Join-Path $env:RUNNER_TEMP ("cloudsync-validate-" + $name + ".ahk")
            Set-Content -LiteralPath $probe -Value $lines -Encoding utf8

            $stderr = Join-Path $env:RUNNER_TEMP ("cloudsync-validate-" + $name + ".stderr")
            $process = Start-Process -FilePath $ahk -ArgumentList @("/validate", "/ErrorStdOut=UTF-8", $probe) -PassThru -RedirectStandardError $stderr
            if (-not $process.WaitForExit(15000)) {
              try { $process.Kill() } catch {}
              throw "Cloud Sync load validation timed out: $name"
            }
            if ($process.ExitCode -ne 0) {
              $detail = if (Test-Path -LiteralPath $stderr) { Get-Content -LiteralPath $stderr -Raw } else { "" }
              throw "Cloud Sync load validation failed: $name (exit code $($process.ExitCode)) $detail"
            }
            Write-Host "Cloud Sync load validation passed: $name"
          }

      - name: Compile main AHK script (x64)
        uses: benmusson/ahk2exe-action@v1
        with:
          in: .\CapsLock-.ahk
          out: .\build\CapsLock-._ci.exe
          target: x64
          compression: none
          ahk-tag: v2.0.27
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Compile main AHK script (x86)
        uses: benmusson/ahk2exe-action@v1
        with:
          in: .\CapsLock-.ahk
          out: .\build\CapsLock-_ci_x86.exe
          target: x86
          compression: none
          ahk-tag: v2.0.27
          github-token: ${{ secrets.GITHUB_TOKEN }}
