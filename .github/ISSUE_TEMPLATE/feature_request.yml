name: "Feature Request"
description: Suggest a new shortcut, workflow, or configuration option
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        CapsLock Extended treats **CapsLock as a stable modifier layer** — a double press still toggles native CapsLock.

        Please keep proposals inside that model: one predictable layer instead of a pile of unrelated global hotkeys, and no cloud account or sign-in.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Text navigation / selection
        - Editing
        - Clipboard & history
        - Smart paste & file workflows
        - Window management & transparency
        - Tabs & taskbar switching
        - Documents / Pandoc conversion
        - Tray menu & settings
        - Configuration options
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What are you trying to do today, and what makes it slow or awkward? Describe the problem before the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behaviour
      description: What should happen, step by step? Include what gets inserted, focused, or changed in the target application.
    validations:
      required: true
  - type: input
    id: shortcut
    attributes:
      label: Proposed shortcut (optional)
      description: If you have a key in mind, write it in CapsLock + <key> form. Leave blank to let the maintainer choose.
      placeholder: CapsLock + N
    validations:
      required: false
  - type: dropdown
    id: conflict
    attributes:
      label: Does this conflict with an existing shortcut?
      description: Check the shortcut table in the README before answering.
      options:
        - "No — the key is free"
        - "Yes — it would replace or remap an existing one (explain below)"
        - "Not sure"
    validations:
      required: true
  - type: dropdown
    id: dependency
    attributes:
      label: External dependency
      description: The core modifier layer must stay usable without third-party tools.
      options:
        - None — works out of the box
        - Optional, like Pandoc / ImageMagick (feature degrades gracefully)
        - Required (may be declined)
    validations:
      required: true
  - type: dropdown
    id: configurable
    attributes:
      label: Should it be configurable?
      options:
        - "Yes — add a tray setting"
        - "No — fixed behaviour is fine"
        - "Not sure"
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other shortcuts, tools, or workarounds you have already tried.
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and this is not a duplicate
          required: true
        - label: This fits the CapsLock-as-modifier model rather than adding unrelated global hotkeys
          required: false
        - label: This does not require a cloud account, sign-in, or network access
          required: true
